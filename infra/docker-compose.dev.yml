# Local dev only: just the stateful services. Run `npm run dev:*` scripts
# against these from the repo root rather than containerizing the app code —
# faster iteration than rebuilding images on every change.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: flashcards
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dev_pgdata:
